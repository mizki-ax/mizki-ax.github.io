
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>little page</title>

  <style>
    body {
      background-color: #f5f5f5;
      color: #333333;
      font-family: Helvetica, sans-serif;
      text-align: center;
      padding: 30px 20px;
      margin: 0;
    }

    h1 {
      color: #E87818;
      font-size: 26px;
      letter-spacing: 0.06em;
    }

    h2 {
      color: #666666;
      font-size: 21px;
      letter-spacing: 0.06em;
    }

    h3 {
      color: #E87818;
      font-size: 23px;
      letter-spacing: 0.06em;
    }

    p {
      line-height: 1.8;
      font-size: 13px;
    }

    .small-text {
      line-height: 1.8;
      font-size: 12px;
    }

    /* 上部のメイン画像 */
    .main-icon {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    /* 各コンテンツのカード */
    .card {
      background-color: white;
      padding: 20px;
      border-radius: 15px;
      margin: 25px auto 0;
      max-width: 400px;
      box-sizing: border-box;
    }

    /* LINKSの上下の余白調整 */
    .card h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    /* SNSアイコンの並び */
    .sns-icons {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 35px;
      flex-wrap: wrap;
    }

    /* アイコンとSNS名 */
    .sns-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 70px;
      color: #333333;
      text-decoration: none;
      font-size: 12px;
    }

    /* SNS画像 */
    .sns-item img {
      display: block;
      width: 32px;
      height: 32px;
      object-fit: contain;
      transition: opacity 0.2s;
    }

    /* ホバー */
    .sns-item:hover img {
      opacity: 0.65;
    }

    .sns-item:hover {
      color: #E87818;
    }
  </style>
</head>

<body>

<button onclick="this.style.backgroundColor='#d46a92'">★</button>

<!-- プロフィール -->
<div class="main">

  <h3>mizki</h3>
  <h1>little page</h1>

  <img src="muzumuzu3.png" class="main-icon">
  <p>graphic design <br/>
       illustration <br/>
       etc...</p>

</div>

  <!-- SNSリンクカード -->
  <div class="card">

    <h2>links</h2>

    <div class="sns-icons">

      <!-- Instagram -->
      <a
        href="https://www.instagram.com/mizki_1/"
        class="sns-item"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagramのプロフィール"
      >
        <img src="Instagram_Glyph_Black.png">
        <span>Instagram</span>
      </a>

      <!-- WEBサイト -->
      <a
        href="https://takeimizuki.studio.site/"
        class="sns-item"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="WEBサイト"
      >
        <img src="B_display.png">
        <span>WEB</span>
      </a>

    </div>
  </div>

</body>
</html>
