<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>litte page</title>
  <style>
    body {
      background-color: #f5f5f5;
      color: #333333;
      font-family: Helvetica;
      text-align: center;
      padding: 30px 20px;
    }

    h1 {
      color: #E87818;
      font-size: 26px;
      letter-spacing: 0.06em;
    }

    h2 {
      color: #666666;
      font-size: 21px;
      letter-spacing: 0.06em;
    }

    h3 {
      color: #E87818;
      font-size: 23px;
      letter-spacing: 0.06em;
    }

    p {
      line-height: 1.8;
      font-size: 13px;
    }

    p2 {
      line-height: 1.8;
      font-size: 12px;
    }

    .card {
      background-color: white;
      padding: 20px;
      border-radius: 15px;
      margin-top: 25px;
    }

    .icon {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    .insta-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      transition: opacity 0.2s;
    }

  <div1 class="card">
    <h2>links</h2>
    
    <div2 class="sns-icons">
     <!-- Instagram -->
     <a href="https://www.instagram.com/あなたのID/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">
       <img src="images/instagram.png" alt="Instagram">
     </a>

     <!-- WEB -->
     <a href="https://x.com/あなたのID"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="X">
       <img src="images/x.png" alt="X">
     </a>
    </div2>
  </div1>
</body>
</html>
